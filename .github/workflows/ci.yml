name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"
      - name: Test (JVM and Scala.js)
        run: sbt test
      - name: Benchmark dry run
        # The other solvers in process only on one instance (princess and SMTInterpol need minutes per operation on some).
        run: bench/fetch-native.sh && sbt "bench/Jmh/run -f 1 -wi 0 -i 1 -e .*OtherSolversBench.*" "bench/Jmh/run -f 1 -wi 0 -i 1 -p instance=QG-classification__qg5__iso_brn001.smt2 .*OtherSolversBench.*"
