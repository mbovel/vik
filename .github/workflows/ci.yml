name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4 # the Scala.js tests run on the WebAssembly backend: a recent Node.js
        with:
          node-version: 24
      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"
      - name: Test (JVM and Scala.js)
        run: sbt test
  bench:
    # The whole benchmark surface, dry: every JMH class and every solver method in quick mode with
    # -foe true — an error in any benchmark fails the job — then the cold pipeline against the real
    # z3 and cvc5 binaries, and the page regenerated byte-identically from the committed results.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Solver binaries (z3 4.14.0, cvc5 1.2.1) and the native libraries
        run: |
          bench/fetch-native.sh
          curl -sfL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.14.0/z3-4.14.0-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp
          echo "/tmp/z3-4.14.0-x64-glibc-2.35/bin" >> "$GITHUB_PATH"
          curl -sfL -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.1/cvc5-Linux-x86_64-static.zip
          unzip -q /tmp/cvc5.zip -d /tmp
          echo "/tmp/cvc5-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
      - name: Solver versions
        run: z3 --version && cvc5 --version
      - name: JMH dry run, every class and method
        run: sbt "bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -e .*OtherSolversBench.* -e .*SmtBench.*; bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -p file=QG-classification__qg5__iso_brn001.smt2,mathsat__FISCHER1-1-fair.smt2,bmc-bv__adpcm.smt2,20172804-Barrett__tests__v1__v1l20086.cvc.smt2,wisas__xs_8_8.smt2 .*SmtBench.*; bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -p file=QG-classification__qg5__iso_brn001.smt2,dillig__20-4.smt2,keymaera__division_dijkstra-node701.smt2,RandomDecoupled__pb_real_30_60_45_28.smt2,20190906-CLEARSY__0020__00009.smt2 .*OtherSolversBench.(vik|vikText|z3|z3Direct|cvc5|princess|smtinterpol)$; bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -p file=storeinv__storeinv_t2_np_nf_ai_00001_001.cvc.smt2,check__array_incompleteness1.smt2,regress0__define-fun-model.smt2,regressions__3775.smt2 .*OtherSolversBench.(vik|vikText)$; bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -p file=storeinv__storeinv_t2_np_nf_ai_00001_001.cvc.smt2,check__array_incompleteness1.smt2,regress0__define-fun-model.smt2 .*OtherSolversBench.cvc5$"
      - name: Cold pipeline dry run
        # One instance per theory, one repetition: the script, the binaries and the answer parsing all
        # work; VIK must answer every instance, the other solvers may error on what they do not speak.
        run: |
          printf '%s\n' \
            smtlib/QF_UF/smt-lib/QG-classification__qg5__iso_brn001.smt2 \
            smtlib/QF_LIA/smt-lib/dillig__20-4.smt2 \
            smtlib/QF_LRA/smt-lib/keymaera__division_dijkstra-node701.smt2 \
            smtlib/QF_AX/smt-lib/storeinv__storeinv_t2_np_nf_ai_00001_001.cvc.smt2 \
            smtlib/HO/z3test/regressions__3775.smt2 \
            smtlib/QF_UF/smt-lib-incremental/20190906-CLEARSY__0016__00003.smt2 \
            > /tmp/cold-dry.txt
          bench/cold.sh /tmp/cold-dry.txt 1 20 > /tmp/cold-dry.tsv
          column -t /tmp/cold-dry.tsv | head -30
          test "$(awk -F'\t' '$3 == "vik-jvm" && ($4 ~ /^(sat|unsat|unknown)(,|$)/)' /tmp/cold-dry.tsv | wc -l)" = 6
      - name: Page regeneration, byte for byte
        run: |
          python3 -m venv bench/.venv && bench/.venv/bin/pip install -q -r bench/requirements.txt
          bench/evaluate.sh regen
          git diff --exit-code docs/_docs/evaluation.md


  docs:
    # One upload at a time: a mirror interleaved with another run's would mix versions on the server.
    concurrency:
      group: docs-upload
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Documentation (the guide, with runnable snippets, and the API of the six modules)
        run: sbt site
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/unidoc
      - name: Upload to the documentation server
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # The directory may already be there, and this server answers 550 to `mkdir` then: best effort.
          lftp -c "set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\"; mkdir -p /vik" || true
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror --reverse --delete --no-perms --parallel=4 --verbose target/unidoc /vik"
