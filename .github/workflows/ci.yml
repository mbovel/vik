name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4 # the Scala.js tests run on the WebAssembly backend: a recent Node.js
        with:
          node-version: 24
      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"
      - name: Test (JVM and Scala.js)
        run: sbt test
      - name: Benchmark dry run
        # Every benchmark class and every solver method, quick mode, -foe true: an error in any benchmark
        # fails the job. Fast instances per theory; the reduced-solver selections mirror evaluate.sh's
        # groups (the replays are not handed arrays or lambdas).
        run: bench/fetch-native.sh && sbt "bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -e .*OtherSolversBench.* -e .*SmtBench.*; bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -p file=QG-classification__qg5__iso_brn001.smt2,mathsat__FISCHER1-1-fair.smt2,bmc-bv__adpcm.smt2,20172804-Barrett__tests__v1__v1l20086.cvc.smt2,wisas__xs_8_8.smt2 .*SmtBench.*; bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -p file=QG-classification__qg5__iso_brn001.smt2,dillig__20-4.smt2,keymaera__division_dijkstra-node701.smt2,RandomDecoupled__pb_real_30_60_45_28.smt2,20190906-CLEARSY__0020__00009.smt2 .*OtherSolversBench.(vik|vikText|z3|z3Direct|cvc5|princess|smtinterpol)$; bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -p file=storeinv__storeinv_t2_np_nf_ai_00001_001.cvc.smt2,check__array_incompleteness1.smt2,regress0__define-fun-model.smt2,regressions__3775.smt2 .*OtherSolversBench.(vik|vikText|cvc5)$"

  docs:
    # One upload at a time: a mirror interleaved with another run's would mix versions on the server.
    concurrency:
      group: docs-upload
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Documentation (the guide, with runnable snippets, and the API of the six modules)
        run: sbt site
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/unidoc
      - name: Upload to the documentation server
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # The directory may already be there, and this server answers 550 to `mkdir` then: best effort.
          lftp -c "set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\"; mkdir -p /vik" || true
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror --reverse --delete --no-perms --parallel=4 --verbose target/unidoc /vik"
