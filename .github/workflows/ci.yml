name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test (JVM and Scala.js)
        run: sbt --batch test
      - name: Benchmark dry run
        run: sbt --batch "egraphBench/Jmh/run -f 1 -wi 0 -i 1"
