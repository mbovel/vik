name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt --server "scalafmtCheckAll; scalafmtSbtCheck"
  test:
    # The JVM suites and the corpus, on the JDK the evaluation runs on (26) and the oldest one supported
    # (17); 25, between them, is left to the bench job.
    strategy:
      fail-fast: false
      matrix:
        java: [17, 26]
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # The corpus test's five seconds are for one's own machine, where a file at the edge is caught; on a
    # shared runner the guard is a hard limit only. It is the job's, not the step's: the sbt server starts
    # with the first step that calls sbt and outlives it, so a variable set on a later step never reaches
    # it (eleven corpus files timed out at five seconds in the graal job that way).
    env:
      VIK_CORPUS_BUDGET_MS: 30000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile (JVM)
        run: sbt --server compileJVM
      - name: Test (JVM, with the corpus)
        run: sbt --server testJVM
  test-js:
    name: test (Scala.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4 # the tests run on the WebAssembly backend: a recent Node.js
        with:
          node-version: 24
      - name: Compile (Scala.js)
        run: sbt --server compileJS
      - name: Test (Scala.js)
        run: sbt --server testJS
      - name: The solver on Node.js against the hand-written corpus files (bench/platforms.sh)
        run: sbt --server docsAssets && bench/platforms.sh <(ls corpus/*/vik/*.smt2) node --stack-size=900000 bench/vik-node.mjs
  test-native:
    # Off until the repository is public, to save CI minutes: remove the `if` to bring it back.
    if: false
    name: test (Scala Native)
    runs-on: ubuntu-latest # clang comes with the runner image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile (Scala Native)
        run: sbt --server compileNative
      - name: Test (Scala Native)
        run: sbt --server testNative
      - name: The solver as a Scala Native binary against the hand-written corpus files (bench/platforms.sh)
        run: sbt --server vikNative/nativeLink && bench/platforms.sh <(ls corpus/*/vik/*.smt2) "$(find target/out/native0.5 -name io.bovel.vik.run -type f | head -1)"
  graal:
    # Every suite the JVM runs, built into a GraalVM native image of their own and run there — the corpus
    # included, so what the binary answers is checked, not only that it starts. The solver's own image is
    # built by the bench job, which measures it.
    # Off until the repository is public, to save CI minutes: drop the `false &&` to bring it back.
    if: false && github.ref_type != 'tag'
    name: test (Graal Native Image)
    runs-on: ubuntu-latest
    env:
      VIK_CORPUS_BUDGET_MS: 30000 # the job's, not the step's: see the test job
      NATIVE_IMAGE_INSTALLED: "true" # the action's GraalVM (GRAALVM_HOME), not a coursier download
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm-community
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile the suites into a native image
        # graal/src/test, the list of suites generated by the build. The image has no JIT, so it runs
        # them in about four minutes where the JVM takes two and a half; the optimization level makes no
        # difference to that (measured 2026-09-04, `-Ob` 4m15 against `-O2` 4m19).
        run: sbt --server "graal/nativeImageTest"
      - name: Test (Graal Native Image, with the corpus)
        run: sbt --server "graal/nativeImageTestRun"
  bench:
    # The whole benchmark surface, dry: every JMH class and every solver method in quick mode with
    # -foe true — an error in any benchmark fails the job — then the cold pipeline against the real
    # z3 and cvc5 binaries, and the page regenerated byte-identically from the committed history
    # (bench/results/evaluation).
    # Off until the repository is public, to save CI minutes: drop the `false &&` to bring it back.
    if: false && github.ref_type != 'tag' # a release tag runs only the tests and the publish
    strategy:
      fail-fast: false
      matrix:
        java: [25] # one JDK: the benchmarks are dry runs, and the tests cover 17 and 26
    name: bench (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    env:
      NATIVE_IMAGE_INSTALLED: "true" # the action's GraalVM (GRAALVM_HOME), not a coursier download
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        # GraalVM's JDK, so that this job also builds the solver's native image, the binary the cold
        # table measures: it belongs with the benchmarks rather than with the tests.
        with:
          java-version: ${{ matrix.java }}
          distribution: graalvm-community
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Solver binaries and native libraries, cached by the versions in bench/fetch-native.sh
        # GitHub rate-limits release downloads (403, 429) when three jobs fetch them at once.
        uses: actions/cache@v4
        with:
          path: bench/native
          key: native-${{ hashFiles('bench/fetch-native.sh') }}
      - run: bench/fetch-native.sh
      - name: Solver versions
        run: bench/native/bin/z3 --version && bench/native/bin/cvc5 --version
      - name: Compile (the benchmarks)
        run: sbt --server "bench/Jmh/compile"
      - name: The replays against the hand-written corpus files (VIK, every check-sat against its status)
        run: sbt --server "bench/runMain io.bovel.bench.evaluation.SolverCheck /vik/ vik"
      - name: The solver as a GraalVM native image
        run: bench/graal.sh
      - name: JMH dry run, every class and method
        # Everything, one invocation, one fork and one iteration each, -foe true: any failure fails the
        # job (a combination on bench/timeouts.txt returns at once, by design). The ten-second budget
        # is raised (-Dvik.bench.budgetMs): a JIT-cold single invocation here is a smoke test, not a
        # measurement.
        run: sbt --server "bench/Jmh/run -foe true -f 1 -wi 0 -i 1 -jvmArgsAppend -Dvik.bench.budgetMs=60000"
      - name: Cold pipeline dry run
        # One instance per theory, one repetition: the script, the binaries and the answer parsing all
        # work; VIK must answer every instance, the other solvers may error on what they do not speak.
        run: |
          printf '%s\n' \
            corpus/QF_UF/smt-lib/QG-classification__qg5__iso_brn001.smt2 \
            corpus/QF_LIA/smt-lib/dillig__20-4.smt2 \
            corpus/QF_LRA/smt-lib/keymaera__division_dijkstra-node701.smt2 \
            corpus/QF_AX/smt-lib/storeinv__storeinv_t2_np_nf_ai_00001_001.cvc.smt2 \
            corpus/QF_BV/smt-lib/bmc-bv__adpcm.smt2 \
            corpus/QF_UF/smt-lib-incremental/20190906-CLEARSY__0016__00004.smt2 \
            > /tmp/cold-dry.txt
          bench/cold.sh /tmp/cold-dry.txt 1 20 > /tmp/cold-dry.tsv
          column -t /tmp/cold-dry.tsv | head -30
          test "$(awk -F'\t' '$3 == "vik-jvm" && ($4 ~ /^(sat|unsat|unknown)(,|$)/)' /tmp/cold-dry.tsv | wc -l)" = 6
      - name: Page regeneration, byte for byte
        run: |
          python3 -m venv bench/.venv && bench/.venv/bin/pip install -q -r bench/requirements.txt
          bench/evaluate.sh regen
          git diff --exit-code docs/_docs/evaluation.md

  publish:
    # Releases the tag's version (`vX.Y.Z` publishes X.Y.Z) to Maven Central: the six library modules,
    # each on JVM, Scala.js and Scala Native. sbt-ci-release signs with the key of the PGP_SECRET and
    # PGP_PASSPHRASE secrets and uploads through the Sonatype Central Portal with SONATYPE_USERNAME
    # and SONATYPE_PASSWORD — the one-time setup is "Releasing" in CONTRIBUTING.md.
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-dynver reads the version from the tag
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish to Maven Central
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          # Every public module on every platform, listed explicitly: the root only aggregates the
          # JVM rows (for unidoc), so the default `+publishSigned` would miss the JS and Native rows.
          CI_RELEASE:
            "all egraph/publishSigned cdclt/publishSigned lia/publishSigned
            smtlib/publishSigned vik/publishSigned egraphJS/publishSigned cdcltJS/publishSigned
            liaJS/publishSigned smtlibJS/publishSigned vikJS/publishSigned
            egraphNative/publishSigned cdcltNative/publishSigned
            liaNative/publishSigned smtlibNative/publishSigned vikNative/publishSigned"
        run: sbt --server ci-release


  docs:
    # One upload at a time: a mirror interleaved with another run's would mix versions on the server.
    concurrency:
      group: docs-upload
      cancel-in-progress: false
    if: github.ref_type != 'tag' # a release tag runs only the tests and the publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Documentation (the guide, with runnable snippets, and the API of the six modules)
        run: sbt --server site
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/unidoc
      - name: Upload to the documentation server
        # `--ignore-time`: Scaladoc writes every page afresh on every build, so their times always differ
        # and the mirror sent all of them, 19 MB, four minutes. Sizes it is, which leaves a page whose
        # length did not change behind — rare for HTML, and the price of comparing content over FTP.
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # The directory may already be there, and this server answers 550 to `mkdir` then: best effort.
          lftp -c "set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\"; mkdir -p /vik" || true
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror --reverse --delete --no-perms --parallel=4 --verbose --ignore-time target/unidoc /vik"
